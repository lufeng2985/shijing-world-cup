<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="诗经杯｜从四十八篇《诗经》代表作中选出你的冠军">
  <title>诗经杯｜The Book of Songs Cup</title>
  <style>
:root {
  --paper: #f2f0ea;
  --paper-2: #e5e1d8;
  --card: #ffffff;
  --ink: #151815;
  --muted: #6b706b;
  --line: #d7d3c9;
  --forest: #12382f;
  --forest-2: #081d19;
  --red: #d94b3d;
  --red-2: #a82e26;
  --gold: #d6ae61;
  --lime: #d8bd82;
  --white: #fff;
  --shadow: 0 24px 70px rgba(18, 26, 22, .11);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--paper); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  margin: -1px;
  padding: 0;
  border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}
body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", Arial, sans-serif;
}
button, input { font: inherit; }
button { color: inherit; }
.paper-noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .55;
  background-image: radial-gradient(rgba(8,29,25,.13) .55px, transparent .55px);
  background-size: 5px 5px;
}

.masthead {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  padding: 11px clamp(18px, 4vw, 64px);
  border-bottom: 1px solid rgba(255,255,255,.1);
  background: rgba(8,29,25,.97);
  color: var(--white);
  backdrop-filter: blur(18px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  color: inherit;
  text-decoration: none;
}
.brand strong { display: block; font-size: 16px; font-weight: 850; letter-spacing: .13em; }
.brand small { display: block; margin-top: 4px; color: #96aaa4; font-size: 10px; letter-spacing: .09em; }
.brand-mark {
  display: grid;
  width: 43px;
  height: 43px;
  place-content: center;
  border: 1px solid #e6a093;
  border-radius: 4px;
  background: #9e2f27;
  color: #fff5e6;
  font-family: "Songti SC", SimSun, serif;
  font-size: 20px;
  font-weight: 950;
}
.masthead .quiet-button { border-color: rgba(255,255,255,.35); color: var(--white); }
.masthead .quiet-button:hover { border-color: var(--white); background: var(--white); color: var(--forest-2); }

.app {
  position: relative;
  width: min(1240px, calc(100% - 32px));
  min-height: calc(100vh - 140px);
  margin: 0 auto;
  padding: clamp(24px, 4vw, 52px) 0 64px;
}
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(350px, .92fr);
  gap: clamp(28px, 5vw, 66px);
  align-items: center;
}

}
.lishu-subtitle img {
  display: block;
  width: clamp(330px, 35vw, 470px);
  max-width: 100%;
  height: auto;
}
.lead { max-width: 700px; margin-bottom: 30px; color: var(--muted); font-size: clamp(15px, 1.6vw, 18px); line-height: 1.9; }
.hero-arena .lead { max-width: 570px; color: #b9c8c3; font-size: 16px; line-height: 1.85; }
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  max-width: 570px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 13px;
  background: rgba(255,255,255,.045);
}
.stat { min-height: 96px; padding: 20px; border-right: 1px solid rgba(255,255,255,.12); }
.stat:last-child { border-right: 0; }
.stat strong { display: block; color: var(--white); font-size: 29px; font-weight: 880; }
.stat span { color: #93aaa3; font-size: 11px; letter-spacing: .08em; }

.filter-panel, .result-card, .stage-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,.9);
  box-shadow: var(--shadow);
}
.hero-console {
  padding: 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 19px;
  background: rgba(5,22,18,.52);
  box-shadow: 0 22px 58px rgba(0,0,0,.2);
  backdrop-filter: blur(12px);
}
.console-head {
  display: flex;
  justify-content: space-between;
  padding: 12px 13px 18px;
  color: #879e97;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .14em;
}
.mode-panel { overflow: hidden; }
.mode-card {
  width: 100%;
  padding: 23px;
  border: 0;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(255,255,255,.035);
  cursor: pointer;
  text-align: left;
  transition: background .18s ease, transform .18s ease;
}
.mode-card + .mode-card { margin-top: 6px; }
.mode-card:hover { background: rgba(255,255,255,.075); }
.mode-card.active { border-color: rgba(216,189,130,.55); background: #eadbb8; color: var(--forest-2); }
.mode-card small { display: block; margin-bottom: 7px; color: #e27c71; font-size: 10px; font-weight: 850; letter-spacing: .17em; }
.mode-card.active small { color: #58711a; }
.mode-card strong { display: block; margin-bottom: 7px; font-size: 20px; }
.mode-card span { color: #9db0aa; font-size: 12px; line-height: 1.65; }
.mode-card.active span { color: #3c4a21; }
.console-route {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 21px 14px 10px;
}
.console-route span {
  display: grid;
  width: 34px;
  height: 34px;
  place-content: center;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  color: #dce7e3;
  font-size: 11px;
  font-weight: 800;
}
.console-route span:last-child { border-color: var(--red); background: var(--red); color: white; }
.console-route i { height: 1px; background: rgba(255,255,255,.19); }
.console-note { margin: 10px 14px 14px; color: #7f9690; font-size: 11px; }
.art-credit { margin: 0 14px 12px; color: rgba(207,220,215,.48); font-size: 9px; }

.section { margin-top: 42px; scroll-margin-top: 92px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.section-heading h2 { margin-bottom: 6px; font-size: clamp(28px, 4.5vw, 46px); font-weight: 820; letter-spacing: -.04em; }
.section-heading p { margin: 0; color: var(--muted); line-height: 1.7; }
.filter-panel { padding: clamp(20px, 4vw, 36px); }
.quota-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; }
.quota-item { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px; min-height: 54px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.quota-item span { color: var(--muted); font-size: 10px; font-weight: 800; }
.quota-item strong { font-family: "Songti SC", STSong, SimSun, serif; font-size: 14px; }
.quota-item b { color: var(--red); font-size: 11px; white-space: nowrap; }
.filter-row { display: grid; grid-template-columns: 108px 1fr; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.filter-row:first-child { padding-top: 0; }
.filter-row:last-of-type { border-bottom: 0; }
.filter-label { padding-top: 9px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .13em; }
.tag-list { display: flex; flex-wrap: wrap; gap: 9px; }
.tag {
  min-height: 40px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  cursor: pointer;
  transition: .16s ease;
}
.tag:hover { border-color: var(--forest); }
.tag.selected { border-color: var(--forest); background: var(--forest); color: var(--white); }
.selection-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 24px 0 18px; }
.search {
  flex: 1 1 220px;
  min-height: 44px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  background: var(--card);
}
.search:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(22,61,52,.1); }
.quiet-button, .primary-button, .danger-button, .rank-button {
  min-height: 44px;
  padding: 10px 17px;
  border: 1px solid var(--forest);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-weight: 680;
  transition: .16s ease;
}
.quiet-button:hover { background: var(--forest); color: var(--white); }
.quiet-button:disabled, .primary-button:disabled { opacity: .42; cursor: not-allowed; }
.primary-button { border-color: var(--red); background: var(--red); color: var(--white); }
.primary-button:hover { border-color: var(--red-2); background: var(--red-2); }
.rank-button {
  border-color: var(--forest);
  background: var(--forest);
  color: var(--white);
}
.rank-button:hover { border-color: var(--forest-2); background: var(--forest-2); }
.rank-button:disabled { opacity: .35; cursor: not-allowed; }
.danger-button { border-color: var(--red); color: var(--red); }
.danger-button:hover { background: var(--red); color: var(--white); }
.pool-summary { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 20px 0 15px; }
.count strong { color: var(--forest); font-size: 31px; }
.count span { color: var(--muted); }
.eligibility { padding: 8px 12px; border-radius: 7px; background: #ece8dd; color: var(--muted); font-size: 12px; }
.eligibility.ready { background: #dce9e3; color: var(--forest); }
.eligibility.blocked { background: #f3dfdb; color: var(--red-2); }
.poet-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; max-height: 720px; padding-right: 6px; overflow: auto; }
.poet-chip {
  position: relative;
  min-height: 190px;
  padding: 17px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  cursor: pointer;
  text-align: left;
}
.poet-chip:hover { border-color: var(--forest); }
.poet-chip.selected { border-color: #7ba394; background: #dfebe5; }
.poet-chip strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: 25px; }
.poet-chip small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
.poet-chip.selected::after { position: absolute; top: 7px; right: 8px; color: var(--forest); content: "✓"; font-weight: 800; }
.poem-preview {
  display: block !important;
  margin-top: 14px !important;
  color: #5d635e !important;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 12px !important;
  line-height: 1.55;
}
.poem-stanza { display: block; }
.poem-stanza + .poem-stanza { margin-top: 3px; }
.poem-preview i, .fighter-excerpt i { display: inline; font-style: normal; white-space: normal; }
.start-bar {
  position: sticky;
  z-index: 15;
  bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-top: 24px;
  padding: 14px 15px 14px 19px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,253,248,.96);
  box-shadow: 0 16px 46px rgba(31,42,35,.16);
  backdrop-filter: blur(12px);
}
.start-bar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.start-bar strong { color: var(--ink); }

.stage-shell { max-width: 1040px; margin: 0 auto; }
.stage-top { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.stage-top h1 { margin-bottom: 8px; font-size: clamp(38px, 6vw, 68px); }
.stage-meta { color: var(--muted); line-height: 1.7; }
.stage-progress { height: 5px; margin: 16px 0 30px; overflow: hidden; border-radius: 99px; background: var(--paper-2); }
.stage-progress > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--red),var(--gold)); transition: width .2s ease; }
.stage-card { padding: clamp(20px,4vw,38px); }
.stage-kicker { margin-bottom: 11px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
.stage-card h2 { margin-bottom: 10px; font-size: clamp(25px,4vw,39px); letter-spacing: -.035em; }
.stage-instruction { margin-bottom: 24px; color: var(--muted); line-height: 1.7; }
.candidate-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.candidate-grid.triad { grid-template-columns: repeat(3,minmax(0,1fr)); }
.candidate-card {
  position: relative;
  min-height: 260px;
  padding: 20px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
  text-align: center;
  transition: transform .16s ease, border-color .16s ease, background .16s ease;
}
.candidate-card:hover { transform: translateY(-3px); border-color: var(--forest); }
.candidate-card.selected { border-color: var(--red); background: #f8e9e5; box-shadow: inset 0 0 0 1px var(--red); }
.candidate-card.eliminate.selected { border-color: #7a7770; background: #e6e2d9; color: #6a6760; }
.candidate-card .number { display: block; margin-bottom: 26px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .15em; }
.candidate-card strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: clamp(27px,3.4vw,42px); font-weight: 700; line-height: 1.05; }
.candidate-card small { display: block; margin-top: 18px; color: var(--muted); font-size: 11px; }
.candidate-card .poem-preview { max-width: none; margin-inline: auto; text-align: left; }
.candidate-card.selected::after { position: absolute; top: 10px; right: 11px; color: var(--red); content: "✓"; font-weight: 900; }
.group-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; }
.group-footer p { margin: 0; color: var(--muted); font-size: 13px; }
.inline-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.stage-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }

.revival-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; max-height: 620px; overflow: auto; }
.revival-card { min-height: 190px; padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; text-align: left; }
.revival-card strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: 17px; }
.revival-card span { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; }
.revival-card.selected { border-color: var(--red); background: #f8e9e5; }

.versus { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: stretch; gap: 16px; }
.fighter {
  min-height: 340px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .16s ease, border-color .16s ease;
}
.fighter:hover { transform: translateY(-4px); border-color: var(--red); }
.fighter-index { color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .18em; }
.fighter-name { display: grid; min-height: 190px; place-content: center; font-family: "Songti SC", SimSun, serif; font-size: clamp(48px,7vw,78px); line-height: 1; text-align: center; }
.fighter-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.mini-tag { padding: 5px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; }
.fighter-excerpt { display: block; max-width: 520px; margin: 20px auto 0; color: #555d58; font-family: "Songti SC", STSong, SimSun, serif; font-size: 14px; line-height: 1.5; text-align: left; }
.fighter-excerpt i { font-style: normal; }
.preselect-poem-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
.preselect-poem-card { position: relative; min-height: 185px; padding: 20px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); cursor: pointer; text-align: left; transition: transform .16s ease,border-color .16s ease,background .16s ease; }
.preselect-poem-card:hover { transform: translateY(-2px); border-color: var(--forest); }
.preselect-poem-card.selected { border-color: var(--red); background: #f8e9e5; box-shadow: inset 0 0 0 1px var(--red); }
.preselect-poem-card strong { display: block; padding-right: 50px; font-family: "Songti SC", STSong, SimSun, serif; font-size: 28px; }
.preselect-poem-card small { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; }
.preselect-check { position: absolute; top: 15px; right: 15px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; }
.preselect-poem-card.selected .preselect-check { border-color: var(--red); background: var(--red); color: white; }
.preselection-summary-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.preselection-summary-grid button { min-height: 82px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; text-align: left; }
.preselection-summary-grid button:hover { border-color: var(--red); }
.preselection-summary-grid small { display: block; margin-bottom: 8px; color: var(--muted); }
.preselection-summary-grid strong { font-family: "Songti SC", STSong, SimSun, serif; font-size: 16px; line-height: 1.6; }
.vs-mark { display: grid; place-content: center; color: var(--red); font-size: 18px; font-weight: 900; font-style: italic; }
.bye-note { margin: -10px 0 24px; padding: 11px 15px; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; background: #eee5d2; color: var(--muted); font-size: 13px; }

.transition-emblem {
  position: absolute;
  top: 18px;
  right: clamp(20px,4vw,48px);
  display: grid;
  width: 64px;
  height: 64px;
  place-content: center;
  border: 1px solid rgba(159,53,45,.35);
  border-radius: 50%;
  color: var(--red);
  font-family: "Songti SC",STSong,SimSun,serif;
  font-size: 34px;
  opacity: .8;
}
.transition-card > h2 { margin-bottom: 8px; font-size: clamp(28px,4vw,44px); }
.transition-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
.transition-panel { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,253,248,.84); }
.transition-panel.advanced { border-color: rgba(159,53,45,.44); }
.transition-panel.eliminated { background: rgba(227,222,211,.76); }
.transition-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
.transition-panel-head h3 { margin: 0; font-size: 18px; }
.transition-panel-head b { display: grid; width: 30px; height: 30px; place-content: center; border-radius: 50%; background: var(--forest); color: white; font-size: 12px; }
.transition-panel.eliminated .transition-panel-head b { background: #918a7f; }
.transition-list { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; max-height: 410px; overflow: auto; }
.transition-person { min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 8px; }
.transition-person strong { display: block; overflow: hidden; font-family: "Songti SC",STSong,SimSun,serif; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }
.transition-person span { display: block; overflow: hidden; margin-top: 5px; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.transition-person.advanced { border-color: rgba(159,53,45,.45); background: #fffdf8; color: var(--ink); box-shadow: 0 4px 15px rgba(68,43,27,.06); }
.transition-person.advanced span { color: var(--red); }
.transition-person.eliminated { border-color: #cbc5ba; background: #dedad1; color: #8d877d; filter: grayscale(1); }
.transition-person.eliminated span { color: #969086; }
.transition-empty { grid-column: 1/-1; margin: 0; padding: 24px; color: var(--muted); text-align: center; }
.transition-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.transition-footer span { max-width: 680px; color: var(--muted); font-size: 12px; }

.result-head { text-align: center; }
.result-head .eyebrow { justify-content: center; }
.result-head h1 { max-width: none; margin-bottom: 12px; font-size: clamp(38px,6.5vw,72px); }
.champion { max-width: 460px; margin: 25px auto 32px; padding: 28px; border: 1px solid var(--gold); border-radius: 15px; background: linear-gradient(145deg,#fbf4e4,#efe0bf); box-shadow: var(--shadow); }
.champion span { color: #806428; font-size: 11px; font-weight: 800; letter-spacing: .19em; }
.champion strong { display: block; margin-top: 10px; color: var(--red); font-family: "Songti SC",SimSun,serif; font-size: 56px; }
.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-bottom: 30px; }
.result-card { overflow: hidden; }
.result-section { padding: 22px; border-bottom: 1px solid var(--line); }
.result-section:last-child { border-bottom: 0; }
.result-section h3 { margin-bottom: 15px; font-size: 17px; }
.statistics-section { background: linear-gradient(135deg,rgba(251,246,234,.94),rgba(243,237,222,.72)); }
.statistics-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.statistics-heading h3 { margin: 0 0 6px; }
.statistics-heading p { margin: 0; color: var(--muted); font-size: 12px; }
.statistics-heading > span { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; white-space: nowrap; }
.statistics-personal { display: grid; grid-template-columns: minmax(140px,.35fr) 1fr; align-items: center; gap: 22px; margin-top: 18px; padding: 18px; border: 1px solid rgba(159,53,45,.25); border-radius: 10px; background: rgba(255,253,248,.84); }
.statistics-personal span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.statistics-personal strong { display: block; margin-top: 5px; color: var(--red); font-family: "Songti SC",STSong,SimSun,serif; font-size: 28px; }
.statistics-personal p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.statistics-personal b { color: var(--ink); }
.statistics-leaders { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin-top: 12px; }
.statistics-leaders > div { min-height: 105px; padding: 15px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,253,248,.7); }
.statistics-leaders small { display: block; margin-bottom: 12px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; }
.statistics-leaders strong { display: block; color: var(--ink); font-family: "Songti SC",STSong,SimSun,serif; font-size: 18px; }
.statistics-leaders span { display: block; margin-top: 7px; color: var(--red); font-size: 11px; }
.statistics-notice { margin: 0; color: var(--muted); font-size: 13px; }
.statistics-retry { margin-top: 14px; }
.statistics-footnote { margin: 14px 0 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
.summary-groups { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; }
.summary-group { padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.summary-group strong { display: block; margin-bottom: 8px; font-size: 12px; }
.summary-group span { display: inline-block; margin: 3px 5px 3px 0; color: var(--muted); font-size: 11px; }
.summary-group span.advanced { color: var(--forest); font-weight: 800; }

.bracket-wing {
  display: grid;
  grid-template-columns: repeat(var(--round-count), minmax(72px,1fr));
  gap: 10px;
}
.bracket-stage {
  position: relative;
  display: grid;
  grid-template-rows: 28px 1fr;
  min-width: 82px;
}
.bracket-stage-label {
  color: #887e6d;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .08em;
  text-align: center;
}
.bracket-stage-nodes {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  min-height: 0;
}
.bracket-node {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 35px;
  padding: 7px;
  border: 1px solid #c9c1b3;
  border-radius: 6px;
  background: rgba(231,226,216,.9);
  color: #8d877d;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 11.5px;
  white-space: nowrap;
}
.bracket-node.advanced {
  border-color: #a43b32;
  background: rgba(255,253,248,.97);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 5px 18px rgba(32,28,22,.08);
}
.bracket-node b { color: #a43b32; font-family: inherit; font-size: 10px; }
.bracket-stage.left .bracket-node::after,
.bracket-stage.right .bracket-node::before {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 1px;
  background: #bdb4a4;
  content: "";
}
.bracket-stage.left .bracket-node::after { right: -11px; }
.bracket-stage.right .bracket-node::before { left: -11px; }
.bracket-stage.left:last-child .bracket-node::after,
.bracket-stage.right:first-child .bracket-node::before { background: #a43b32; }
.bracket-center {
  align-self: center;
  padding: 28px 16px;
  border: 1px solid #9f352d;
  border-radius: 10px;
  background: #9f352d;
  color: white;
  text-align: center;
  box-shadow: 0 20px 50px rgba(92,31,26,.22);
}
.bracket-center .cup-mark {
  display: block;
  margin-bottom: 7px;
  color: #ead39b;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
}
.bracket-center small { display: block; color: #ecc9c5; font-size: 9px; letter-spacing: .2em; }
.bracket-center strong {
  display: block;
  margin: 17px 0 10px;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 34px;
}
.bracket-center i { color: #f0d8d4; font-size: 10px; font-style: normal; }
.bracket { display: flex; align-items: stretch; gap: 12px; width: max-content; min-width: 100%; }
.round-column { width: 210px; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
.round-column h3 { margin: 0 0 11px; padding-bottom: 9px; border-bottom: 1px solid var(--line); font-size: 13px; }
.round-person { display: flex; justify-content: space-between; gap: 8px; padding: 6px 3px; border-bottom: 1px dotted #ded5c5; color: var(--muted); font-size: 12px; }
.round-person.advanced { color: var(--ink); font-weight: 750; }
.round-person .tick { color: var(--red); }
.champion-column { display: grid; min-height: 170px; place-content: center; text-align: center; }
.champion-column strong { color: var(--red); font-family: "Songti SC",SimSun,serif; font-size: 28px; }
.empty { grid-column: 1/-1; padding: 40px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
.footer { display: flex; justify-content: space-between; gap: 20px; padding: 20px clamp(18px,4vw,60px); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.footer a { color: inherit; text-underline-offset: 3px; }
.confirm-overlay {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(25, 23, 19, .58);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.confirm-overlay[hidden] { display: none; }
.confirm-panel {
  width: min(100%, 430px);
  padding: 30px;
  border: 1px solid rgba(164, 59, 50, .38);
  border-radius: 14px;
  background: #fffdf8;
  box-shadow: 0 24px 70px rgba(25, 20, 15, .3);
  text-align: center;
}
.confirm-kicker {
  display: block;
  margin-bottom: 9px;
  color: var(--red);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .2em;
}
.confirm-panel h2 {
  margin: 0;
  color: var(--ink);
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: clamp(22px, 4vw, 28px);
}
.confirm-panel p { margin: 13px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.confirm-actions button { min-height: 46px; }
.hidden { display: none !important; }

@media (max-width: 940px) {
  .transition-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .hero { grid-template-columns: 1fr; }
  .hero-arena::after { display: none; }
  .hero-console { max-width: 640px; }
  .poet-grid, .revival-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .summary-groups { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .quota-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 680px) {
  .transition-columns { grid-template-columns: 1fr; }
  .transition-list { grid-template-columns: repeat(2,minmax(0,1fr)); max-height: 300px; }
  .transition-footer { align-items: stretch; flex-direction: column; }
  .transition-footer .primary-button { width: 100%; }
  .masthead { min-height: 64px; }
  .brand small { display: none; }
  .app { width: min(100% - 20px,1200px); padding-top: 28px; }

  <script>
(function () {
  "use strict";

  const data = window.POET_DATA;
  const app = document.getElementById("app");
  const resumeButton = document.querySelector(".resume-button");
  const STORAGE_KEY = "shijing-cup-v1";
  const PRESELECTION_KEY = "shijing-cup-preselection-v1";
  const allPeriods = new Set(data.periodOrder);
  const allGenres = new Set(["poetry", "ci"]);

  let mode = "default";
  let selectedPeriods = new Set(allPeriods);
  let selectedGenres = new Set(allGenres);
  let selectedCustom = new Set(data.poets.map((poet) => poet.id));
  let searchText = "";
  let tournament = null;
  let stageSelection = new Set();
  let undoStack = [];
  let restartTrigger = null;
  let preselection = null;
  let statisticsState = { status: "idle", data: null, error: "" };

  const escapeHtml = (value) =>
    String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

  const shuffle = (items) => {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };

  const topRanked = (items, count) =>
    [...items]
      .sort((a, b) => (b.score - a.score) || a.name.localeCompare(b.name, "zh-CN"))
      .slice(0, count);

  const unique = (items) => {
    const seen = new Set();
    return items.filter((item) => {
      if (seen.has(item.id)) return false;
      seen.add(item.id);
      return true;
    });
  };

  function anonymousSubmissionId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
  }

  function placementsFromTournament(state) {
    const rounds = state?.knockout?.rounds || [];
    const finalMatch = rounds.at(-1)?.matches?.[0];
    const champion = state?.champion;
    if (!champion || !finalMatch?.a || !finalMatch?.b) return null;
    const runnerUp = finalMatch.a.id === champion.id ? finalMatch.b : finalMatch.a;
    const semifinalRound = [...rounds].reverse().find((round) => unique(round.entrants || []).length === 4);
    const semifinalists = unique(semifinalRound?.entrants || []);
    if (semifinalists.length !== 4 || !semifinalists.some((poem) => poem.id === champion.id) || !semifinalists.some((poem) => poem.id === runnerUp.id)) return null;
    return { champion, runnerUp, semifinalists };
  }

  function resultPlacements() {
    return placementsFromTournament(tournament);
  }

  function leaderMarkup(items) {
    if (!items?.length) return "暂无数据";
    const names = items.map((item) => `《${escapeHtml(item.name)}》`).join("、");
    const first = items[0];
    return `<strong>${names}</strong><span>${first.count}份 · ${first.percent}%</span>`;
  }

  function statisticsMarkup() {
    if (statisticsState.status === "loading" || statisticsState.status === "idle") {
      return `<section class="result-section statistics-section" data-statistics><h3>全站结果统计</h3><p class="statistics-notice">正在匿名提交本次名次并读取累计结果……</p></section>`;
    }
    if (statisticsState.status === "error") {
      return `<section class="result-section statistics-section" data-statistics><h3>全站结果统计</h3><p class="statistics-notice">${escapeHtml(statisticsState.error)}</p><button class="quiet-button statistics-retry" type="button" data-action="retry-statistics">重新加载</button></section>`;
    }
    const stats = statisticsState.data;
    return `<section class="result-section statistics-section" data-statistics>
      <div class="statistics-heading"><div><h3>全站结果统计</h3><p>自统计功能上线后，已收录 ${stats.total} 份完整结果。</p></div><span>仅提交冠军、亚军与四强</span></div>
      <div class="statistics-personal">
        <div><span>你的冠军篇目</span><strong>${escapeHtml(stats.selected.champion)}</strong></div>
        <p>其中 <b>${stats.selected.championCount}份（${stats.selected.championPercent}%）</b> 的冠军同样是《${escapeHtml(stats.selected.champion)}》；<b>${stats.selected.topFourCount}份（${stats.selected.topFourPercent}%）</b>将其选入四强。</p>
      </div>
      <div class="statistics-leaders">
        <div><small>冠军最多</small>${leaderMarkup(stats.leaders.champion)}</div>
        <div><small>亚军最多</small>${leaderMarkup(stats.leaders.runnerUp)}</div>
        <div><small>进入四强最多</small>${leaderMarkup(stats.leaders.topFour)}</div>
      </div>
      <p class="statistics-footnote">匿名随机编号仅用于避免刷新造成重复计数；不提交评选过程、姓名、账号或设备资料。</p>
    </section>`;
  }

  function updateStatisticsPanel() {
    const panel = document.querySelector("[data-statistics]");
    if (!panel) return;
    const template = document.createElement("template");
    template.innerHTML = statisticsMarkup().trim();
    panel.replaceWith(template.content.firstElementChild);
  }

  async function submitStatistics() {
    const placements = resultPlacements();
    if (!placements) {
      statisticsState = { status: "error", data: null, error: "无法从本次签表中读取完整四强，结果未提交。" };
      updateStatisticsPanel();
      return;
    }
    if (!tournament.statisticsSubmissionId) {
      tournament.statisticsSubmissionId = anonymousSubmissionId();
      saveTournament();
    }
    statisticsState = { status: "loading", data: null, error: "" };
    updateStatisticsPanel();
    try {
      const response = await fetch("/api/results", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: "shijing",
          submissionId: tournament.statisticsSubmissionId,
          championId: placements.champion.id,
          runnerUpId: placements.runnerUp.id,
          semifinalistIds: placements.semifinalists.map((poem) => poem.id)
        })
      });
      if (!response.ok) throw new Error("request failed");
      statisticsState = { status: "ready", data: await response.json(), error: "" };
    } catch (_) {
      statisticsState = { status: "error", data: null, error: "统计服务暂时无法连接；本地比赛结果不受影响。" };
    }
    updateStatisticsPanel();
  }

  function fullTitle(title) {
    return `${title}·詩經杯`;
  }

  function saveTournament() {
    try {
      if (tournament) localStorage.setItem(STORAGE_KEY, JSON.stringify(tournament));
      else localStorage.removeItem(STORAGE_KEY);
    } catch (_) {
      // Local files can still run when browser storage is unavailable.
    }
    updateResumeButton();
  }

  function loadTournament() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : null;
    } catch (_) {
      return null;
    }
  }

  function savePreselection() {
    try {
      if (preselection) localStorage.setItem(PRESELECTION_KEY, JSON.stringify(preselection));
      else localStorage.removeItem(PRESELECTION_KEY);
    } catch (_) {
      // The preselection can still run when storage is unavailable.
    }
  }

  function loadPreselection() {
    try {
      const saved = localStorage.getItem(PRESELECTION_KEY);
      return saved ? JSON.parse(saved) : null;
    } catch (_) {
      return null;
    }
  }

  function updateResumeButton() {
    resumeButton.classList.toggle("hidden", !loadTournament());
  }

  function showRestartConfirmation(trigger) {
    const overlay = document.querySelector("[data-confirm-restart]");
    if (!overlay) return;
    restartTrigger = trigger || document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    overlay.querySelector('[data-action="cancel-restart"]')?.focus();
  }

  function hideRestartConfirmation() {
    const overlay = document.querySelector("[data-confirm-restart]");
    if (!overlay || overlay.hidden) return;
    overlay.hidden = true;
    document.body.style.overflow = "";
    restartTrigger?.focus?.();
    restartTrigger = null;
  }

  function abandonTournament() {
    hideRestartConfirmation();
    tournament = null;
    stageSelection.clear();
    undoStack = [];
    saveTournament();
    renderHome();
  }

  function remember() {
    undoStack.push(JSON.stringify(tournament));
    if (undoStack.length > 60) undoStack.shift();
  }

  function departmentText(poet) {
    if (poet.departments.length === 2) return "诗／词";
    return poet.departments[0] === "poetry" ? "诗" : "词";
  }

  function filteredPoets() {
    return data.poets.filter((poet) =>
      selectedPeriods.has(poet.period) &&
      poet.departments.some((genre) => selectedGenres.has(genre))
    );
  }

  function resetSelectionToTags() {
    selectedCustom = new Set(filteredPoets().map((poet) => poet.id));
  }

  function customTitle() {
    const periodKeys = data.periodOrder.filter((key) => selectedPeriods.has(key));
    const periodPart = periodKeys.length === data.periodOrder.length
      ? "古代"
      : periodKeys.map((key) => data.groups[key].titleLabel || data.groups[key].label).join("、");
    let genrePart = "诗（词）人";
    if (selectedGenres.size === 1) genrePart = selectedGenres.has("poetry") ? "诗人" : "词人";
    return periodPart + genrePart;
  }

  function formatForCount(count, selectedMode = "custom") {
    if (selectedMode === "default") {
      return { key: "default48", ready: true, label: "48 → 小组24 → 复活至32 → 淘汰赛" };
    }
    if (count < 24) return { key: "tooFew", ready: false, label: `还需加入 ${24 - count} 人` };
    if (count <= 31) return { key: "byes16", ready: true, label: `${count} → 自选${32 - count}人轮空 → 16强` };
    if (count <= 47) return { key: "cut32", ready: true, label: count === 32 ? "32 → 32强淘汰赛" : `${count} → 保留32 → 32强淘汰赛` };
    if (count === 48) return { key: "custom48", ready: true, label: "48 → 小组24 → 复活至32 → 淘汰赛" };
    if (count <= 56) return { key: "cut48", ready: true, label: `${count} → 保留48 → 小组24 → 复活至32 → 淘汰赛` };
    if (count <= 72) return { key: "prelim48", ready: true, label: `${count} → 三进二预选 → 复活至48 → 小组24 → 复活至32 → 淘汰赛` };
    return { key: "tooMany", ready: false, label: `需移除 ${count - 72} 人` };
  }

  function poetChip(poet, selected) {
    return `
      <button class="poet-chip ${selected ? "selected" : ""}" type="button"
        data-action="toggle-poet" data-id="${escapeHtml(poet.id)}" aria-pressed="${selected}">
        <strong>${escapeHtml(poet.name)}</strong>
        <small>${escapeHtml(poet.location)}</small>
        ${poemExcerpt(poet)}
      </button>`;
  }

  function poemExcerpt(poem, className = "poem-preview") {
    const stanzas = poem.excerptStanzas?.length ? poem.excerptStanzas : [poem.excerpt];
    const mobileLength = poem.mobileExcerptLength ?? 4;
    let clauseIndex = 0;
    return `<span class="${className}">${stanzas.map((stanza) => {
      const stanzaClass = clauseIndex >= mobileLength ? " mobile-hidden-stanza" : "";
      return `<span class="poem-stanza${stanzaClass}">${stanza.map((line) => {
        const mobileClass = clauseIndex++ >= mobileLength ? " mobile-extra" : "";
        return `<i class="${mobileClass.trim()}">${escapeHtml(line)}</i>`;
      }).join("")}</span>`;
    }).join("")}</span>`;
  }

  function heroMarkup() {

  function renderDefaultSection() {
    const savedSelection = loadPreselection();
    return `
      <section class="section" id="selection">
        <div class="section-heading">
          <div><h2>先从三百零五篇中选出四十八篇</h2><p>逐国、逐什完成篇目预选；每个单元达到规定名额后才能进入下一项。</p></div>
        </div>
        <div class="filter-panel">
          <div class="quota-grid">
            ${data.selectionUnits.map((unit, index) => `<div class="quota-item">
              <span>${String(index + 1).padStart(2, "0")}</span>
              <strong>${escapeHtml(unit.label)}</strong>
              <b>选${unit.quota}篇</b>
            </div>`).join("")}
          </div>
          <div class="start-bar">
            <p><strong>第一阶段：篇目预选</strong><br>305篇 → 按28个单元选出48篇 → 四选二小组赛</p>
            <div class="inline-actions">
              ${savedSelection ? '<button class="quiet-button" type="button" data-action="resume-preselection">继续上次预选</button>' : ""}
              <button class="primary-button" type="button" data-action="start-preselection">开始篇目预选</button>
            </div>
          </div>
        </div>
      </section>`;
  }

  function preselectionCard(poem, selected) {
    return `<button class="preselect-poem-card ${selected ? "selected" : ""}" type="button"
      data-action="preselect-toggle" data-id="${escapeHtml(poem.id)}" aria-pressed="${selected}">
      <span class="preselect-check">${selected ? "已选" : "选择"}</span>
      <strong>${escapeHtml(poem.name)}</strong>
      <small>${escapeHtml(poem.location)}</small>
      ${poemExcerpt(poem)}
    </button>`;
  }

  function selectedIdsForUnit(unit) {
    return new Set(preselection?.selections?.[unit.id] || []);
  }

  function allPreselectedPoems() {
    if (!preselection) return [];
    const selectedIds = data.selectionUnits.flatMap((unit) => preselection.selections[unit.id] || []);
    const selectedSet = new Set(selectedIds);
    return data.poems.filter((poem) => selectedSet.has(poem.id));
  }

  function renderPreselection() {
    const unit = data.selectionUnits[preselection.current];
    const selected = selectedIdsForUnit(unit);
    const completedUnits = data.selectionUnits.filter((item) => (preselection.selections[item.id] || []).length === item.quota).length;
    const progress = Math.round((completedUnits / data.selectionUnits.length) * 100);
    app.innerHTML = `<section class="stage-shell preselection-shell">
      ${stageHeader("篇目预选", `${unit.label} · 选${unit.quota}篇`, `第 ${preselection.current + 1}/${data.selectionUnits.length} 项；本单元共 ${unit.poems.length} 篇。`, progress)}
      <div class="stage-card">
        <p class="stage-kicker">QUALIFYING SELECTION</p>
        <h2>选出${unit.quota}篇进入四十八篇主赛</h2>
        <p class="stage-instruction">按篇名、所属位置和提示诗句作出选择。已选 ${selected.size}/${unit.quota} 篇。</p>
        <div class="preselect-poem-grid">
          ${unit.poems.map((poem) => preselectionCard(poem, selected.has(poem.id))).join("")}
        </div>
        <div class="group-footer">
          <p>已完成 ${completedUnits}/${data.selectionUnits.length} 个预选单元</p>
          <div class="inline-actions">
            <button class="quiet-button" type="button" data-action="preselect-prev" ${preselection.current === 0 ? "disabled" : ""}>上一项</button>
            <button class="primary-button" type="button" data-action="confirm-preselection" ${selected.size === unit.quota ? "" : "disabled"}>${preselection.current === data.selectionUnits.length - 1 ? "完成预选" : "确认并进入下一项"}</button>
          </div>
        </div>
      </div>
      <div class="stage-actions"><button class="quiet-button" type="button" data-action="preselect-home">暂存并返回首页</button><button class="danger-button" type="button" data-action="restart-preselection">重新开始预选</button></div>
    </section>`;
  }

  function renderPreselectionSummary() {
    const selectedPoems = allPreselectedPoems();
    app.innerHTML = `<section class="stage-shell preselection-shell">
      ${stageHeader("篇目预选", "四十八篇名单已产生", "检查名单后即可随机分组，进入12组四选二小组赛。", 100)}
      <div class="stage-card">
        <p class="stage-kicker">QUALIFIERS</p>
        <h2>你选出的四十八篇</h2>
        <div class="preselection-summary-grid">
          ${data.selectionUnits.map((unit, index) => {
            const ids = new Set(preselection.selections[unit.id] || []);
            const names = unit.poems.filter((poem) => ids.has(poem.id)).map((poem) => poem.name);
            return `<button type="button" data-action="edit-preselection" data-index="${index}"><small>${escapeHtml(unit.label)} · ${unit.quota}篇</small><strong>${names.map(escapeHtml).join("、")}</strong></button>`;
          }).join("")}
        </div>
        <div class="start-bar">
          <p><strong>${fullTitle("詩經四十八篇")}</strong><br>${selectedPoems.length}篇 → 小组赛24篇 → 复活8篇至32篇 → 1对1淘汰</p>
          <button class="primary-button" type="button" data-action="start-main-tournament">随机分组并开始主赛</button>
        </div>
      </div>
      <div class="stage-actions"><button class="quiet-button" type="button" data-action="preselect-home">暂存并返回首页</button><button class="danger-button" type="button" data-action="restart-preselection">重新开始预选</button></div>
    </section>`;
  }

  function customSectionMarkup() {
    const filtered = filteredPoets();

    const selectedCount = selectedCustom.size;
    const format = formatForCount(selectedCount);
    return `

          <div class="filter-row">

              ${data.periodOrder.map((key) => `
