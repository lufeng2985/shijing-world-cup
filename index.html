                  ${escapeHtml(data.groups[key].label)}
                </button>`).join("")}
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-label">文体标签</div>
            <div class="tag-list">
              <button class="tag ${selectedGenres.has("poetry") ? "selected" : ""}" type="button"
                data-action="genre-tag" data-value="poetry" aria-pressed="${selectedGenres.has("poetry")}">诗</button>
              <button class="tag ${selectedGenres.has("ci") ? "selected" : ""}" type="button"
                data-action="genre-tag" data-value="ci" aria-pressed="${selectedGenres.has("ci")}">词</button>
            </div>
          </div>
          <div class="selection-tools">
            <input class="search" type="search" value="${escapeHtml(searchText)}" placeholder="搜索作者姓名" aria-label="搜索作者姓名" data-search>
            <button class="quiet-button" type="button" data-action="select-all">全选筛选结果</button>
            <button class="rank-button" type="button" data-action="system-select" data-count="24" ${filtered.length > 24 ? "" : "disabled"}>系统选择24人</button>
            <button class="rank-button" type="button" data-action="system-select" data-count="48" ${filtered.length > 48 ? "" : "disabled"}>系统选择48人</button>
            <button class="quiet-button" type="button" data-action="random-48" ${filtered.length < 24 ? "disabled" : ""}>随机选择48人</button>
            <button class="quiet-button" type="button" data-action="clear-selection">清空</button>
          </div>
          <div class="pool-summary">
            <div class="count"><strong>${selectedCount}</strong> <span>人已入选／当前标签命中 ${filtered.length} 人</span></div>
            <div class="eligibility ${format.ready ? "ready" : "blocked"}">${escapeHtml(format.label)}</div>
          </div>
          <div class="poet-grid">
            ${visible.length
              ? visible.map((poet) => poetChip(poet, selectedCustom.has(poet.id))).join("")
              : '<div class="empty">当前标签或搜索条件下没有作者。</div>'}
          </div>
          <div class="start-bar">
            <p><strong>${escapeHtml(fullTitle(customTitle()))}</strong><br>${escapeHtml(format.label)}</p>
            <button class="primary-button" type="button" data-action="start" ${format.ready ? "" : "disabled"}>以 ${selectedCount} 人开赛</button>
          </div>
        </div>
      </section>`;
  }

  function renderHome() {
    tournament = null;
    stageSelection.clear();
    undoStack = [];
    app.innerHTML = heroMarkup() + renderDefaultSection();
    updateResumeButton();
  }

  function startTournament(selectedEntrants) {
    const entrants = shuffle(selectedEntrants);
    const format = formatForCount(entrants.length, "default");
    if (!format.ready) return;

    tournament = {
      version: 4,
      title: "詩經四十八篇",
      mode: "default",
      initialCount: entrants.length,
      initialEntrants: entrants,
      format: format.key,
      phase: "",
      cut: null,
      prelim: null,
      prelimRevival: null,
      groupStage: null,
      groupRevival: null,
      byeSelection: null,
      knockout: null,
      transition: null,
      champion: null,
      statisticsSubmissionId: anonymousSubmissionId(),
      startedAt: new Date().toISOString()
    };
    undoStack = [];
    stageSelection.clear();

    if (format.key === "default48") setupGroupStage(entrants, 32);
    if (format.key === "byes16") setupKnockout(entrants);
    if (format.key === "cut32") entrants.length === 32 ? setupKnockout(entrants) : setupCut(entrants, 32, "knockout");
    if (format.key === "custom48") setupGroupStage(entrants, 32);
    if (format.key === "cut48") setupCut(entrants, 48, "groups");
    if (format.key === "prelim48") setupPrelim(entrants);
    saveTournament();
    renderStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function setupCut(entrants, target, next) {
    tournament.phase = "cut";
    tournament.cut = { entrants, target, next, kept: null, eliminated: null };
  }

  function buildGroups(entrants, size) {
    const groups = [];
    for (let i = 0; i < entrants.length; i += size) {
      const members = entrants.slice(i, i + size);
      groups.push({
        entrants: members,
        survivors: members.length <= 2 ? [...members] : null,
        eliminated: members.length <= 2 ? [] : null,
        automatic: members.length <= 2
      });
    }
    return groups;
  }

  function firstPendingGroup(groups) {
    return groups.findIndex((group) => !group.survivors);
  }

  function setupPrelim(entrants) {
    const groups = buildGroups(shuffle(entrants), 3);
    tournament.prelim = { entrants, groups, current: firstPendingGroup(groups) };
    tournament.phase = "prelim";
    if (tournament.prelim.current === -1) finishGroups("prelim");
  }

  function setupGroupStage(entrants, target) {
    const groups = buildGroups(shuffle(entrants), 4);
    tournament.groupStage = { entrants, groups, current: firstPendingGroup(groups), target };
    tournament.phase = "groups";
    if (tournament.groupStage.current === -1) finishGroups("groups");
  }

  function setupRevival(kind, survivors, eliminated, target) {
    const required = target - survivors.length;
    if (required <= 0) {
      if (kind === "prelim") setupGroupStage(survivors.slice(0, target), 32);
      else setupKnockout(survivors.slice(0, target));
      return;
    }
    const revival = { survivors, candidates: eliminated, required, selected: null };
    if (kind === "prelim") {
      tournament.prelimRevival = revival;
      tournament.phase = "prelim-revival";
    } else {
      tournament.groupRevival = revival;
      tournament.phase = "group-revival";
    }
  }

  function setupKnockout(entrants) {
    tournament.knockout = { rounds: [], currentRound: 0, currentMatch: 0 };
    const ordered = shuffle(entrants);
    const required = byeCountFor(ordered.length);
    if (required > 0) {
      tournament.byeSelection = { entrants: ordered, required, selected: null };
      tournament.phase = "bye-selection";
      return;
    }
    tournament.phase = "knockout";
    makeKnockoutRound(ordered);
  }

  function byeCountFor(count) {
    const bracketSize = 2 ** Math.ceil(Math.log2(count));
    return bracketSize - count;
  }

  function distributedByePositions(matchCount, byeCount) {
    const positions = [];
    for (let index = 0; index < matchCount && positions.length < byeCount; index += 2) positions.push(index);
    for (let index = 1; index < matchCount && positions.length < byeCount; index += 2) positions.push(index);
    return new Set(positions);
  }

  function buildKnockoutRound(entrants, selectedByes = []) {
    const ordered = [...entrants];
    const bracketSize = 2 ** Math.ceil(Math.log2(ordered.length));
    const matchCount = bracketSize / 2;
    const byeCount = bracketSize - ordered.length;
    if (selectedByes.length !== byeCount) throw new Error(`Expected ${byeCount} selected byes, got ${selectedByes.length}`);
    const byePositions = distributedByePositions(matchCount, byeCount);
    const byeIds = new Set(selectedByes.map((poet) => poet.id));
    // The draw is shuffled once in setupKnockout. Never reshuffle between
    // knockout rounds: adjacent winners must stay on the same bracket path.
    const byePool = ordered.filter((poet) => byeIds.has(poet.id));
    const playingPool = ordered.filter((poet) => !byeIds.has(poet.id));
    const round = { entrants: [], byes: [], matches: [] };
    for (let matchIndex = 0; matchIndex < matchCount; matchIndex += 1) {
      if (byePositions.has(matchIndex)) {
        const a = byePool.shift();
        round.entrants.push(a);
        round.byes.push(a);
        round.matches.push({ a, b: null, winner: a, automatic: true });
      } else {
        const a = playingPool.shift();
        const b = playingPool.shift();
        round.entrants.push(a, b);
        round.matches.push({ a, b, winner: null, automatic: false });
      }
    }
    return round;
  }

  function makeKnockoutRound(entrants, selectedByes = []) {
    const round = buildKnockoutRound(entrants, selectedByes);
    tournament.knockout.rounds.push(round);
    tournament.knockout.currentRound = tournament.knockout.rounds.length - 1;
    tournament.knockout.currentMatch = firstPendingMatch(round);
  }

  function confirmByes() {
    const state = tournament.byeSelection;
    if (!state || stageSelection.size !== state.required) return;
    remember();
    state.selected = state.entrants.filter((poet) => stageSelection.has(poet.id));
    stageSelection.clear();
    tournament.phase = "knockout";
    makeKnockoutRound(state.entrants, state.selected);
    saveTournament();
    renderStage();
  }

  function firstPendingMatch(round) {
    return round.matches.findIndex((match) => !match.winner);
  }

  function showTransition(kicker, title, meta, advanced, eliminated, next) {
    tournament.transition = {
      kicker,
      title,
      meta,
      advanced: unique(advanced),
      eliminated: unique(eliminated),
      next
    };
    tournament.phase = "transition";
  }

  function continueTransition() {
    const transition = tournament.transition;
    if (!transition) return;
    remember();
    tournament.transition = null;
    const next = transition.next;
    if (next.type === "revival") setupRevival(next.kind, transition.advanced, transition.eliminated, next.target);
    if (next.type === "groups") setupGroupStage(transition.advanced, next.target);
    if (next.type === "knockout") setupKnockout(transition.advanced);
    if (next.type === "knockout-round") {
      tournament.phase = "knockout";
      makeKnockoutRound(transition.advanced);
    }
    if (next.type === "result") {
      tournament.champion = transition.advanced[0];
      tournament.phase = "result";
    }
    saveTournament();
    renderStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function currentGroupState() {
    return tournament.phase === "prelim" ? tournament.prelim : tournament.groupStage;
  }

  function finishGroups(kind) {
    const state = kind === "prelim" ? tournament.prelim : tournament.groupStage;
    const survivors = unique(state.groups.flatMap((group) => group.survivors || []));
    const eliminated = unique(state.groups.flatMap((group) => group.eliminated || []));
    stageSelection.clear();
    const stageName = kind === "prelim" ? "\u9884\u9009\u8d5b" : "\u5c0f\u7ec4\u8d5b";
    const target = kind === "prelim" ? 48 : state.target;
    showTransition(
      `${stageName}\u7ed3\u675f`,
      `${survivors.length}\u7bc7\u76f4\u63a5\u664b\u7ea7`,
      `${eliminated.length}\u7bc7\u6682\u5217\u6dd8\u6c70\u533a\uff1b\u4e0b\u4e00\u9875\u5c06\u4ece\u4e2d\u9009\u62e9\u590d\u6d3b\u7bc7\u76ee\u3002`,
      survivors,
      eliminated,
      { type: "revival", kind, target }
    );
  }

  function confirmCut() {
    const state = tournament.cut;
    if (stageSelection.size !== state.target) return;
    remember();
    state.kept = state.entrants.filter((poet) => stageSelection.has(poet.id));
    state.eliminated = state.entrants.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    showTransition(
      "\u540d\u5355\u88c1\u5b9a\u7ed3\u675f",
      `${state.kept.length}\u4eba\u8fdb\u5165\u6b63\u8d5b`,
      `${state.eliminated.length}\u4eba\u6b62\u6b65\u540d\u5355\u88c1\u5b9a\u3002`,
      state.kept,
      state.eliminated,
      state.next === "groups" ? { type: "groups", target: 32 } : { type: "knockout" }
    );
    saveTournament();
    renderStage();
  }

  function confirmGroup() {
    const state = currentGroupState();
    const group = state.groups[state.current];
    if (!group || stageSelection.size !== 2) return;
    remember();
    group.survivors = group.entrants.filter((poet) => stageSelection.has(poet.id));
    group.eliminated = group.entrants.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    state.current = firstPendingGroup(state.groups);
    if (state.current === -1) finishGroups(tournament.phase === "prelim" ? "prelim" : "groups");
    saveTournament();
    renderStage();
  }

  function confirmRevival() {
    const kind = tournament.phase;
    const state = kind === "prelim-revival" ? tournament.prelimRevival : tournament.groupRevival;
    if (stageSelection.size !== state.required) return;
    remember();
    state.selected = state.candidates.filter((poet) => stageSelection.has(poet.id));
    const entrants = unique([...state.survivors, ...state.selected]);
    const eliminated = state.candidates.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    showTransition(
      "\u590d\u6d3b\u8d5b\u7ed3\u675f",
      `${entrants.length}\u7bc7\u664b\u7ea7\u4e0b\u4e00\u9636\u6bb5`,
      `${state.selected.length}\u7bc7\u590d\u6d3b\u6210\u529f\uff0c${eliminated.length}\u7bc7\u672c\u5c4a\u6b62\u6b65\u3002`,
      entrants,
      eliminated,
      kind === "prelim-revival" ? { type: "groups", target: 32 } : { type: "knockout" }
    );
    saveTournament();
    renderStage();
  }

  function knockoutRound() {
    return tournament.knockout.rounds[tournament.knockout.currentRound];
  }

  function knockoutMatch() {
    return knockoutRound().matches[tournament.knockout.currentMatch];
  }

  function chooseWinner(id) {
    if (tournament.phase !== "knockout" || tournament.champion) return;
    remember();
    const round = knockoutRound();
    const match = knockoutMatch();
    if (!match || !match.b || match.winner) return;
    match.winner = match.a.id === id ? match.a : match.b;
    tournament.knockout.currentMatch = firstPendingMatch(round);

    if (tournament.knockout.currentMatch === -1) {
      const winners = round.matches.map((item) => item.winner);
      const winnerIds = new Set(winners.map((poet) => poet.id));
      const eliminated = round.entrants.filter((poet) => !winnerIds.has(poet.id));
      const currentLabel = roundLabel(round.entrants.length);
      showTransition(
        `${currentLabel}\u7ed3\u675f`,
        winners.length === 1 ? `${winners[0].name}\u593a\u5f97\u8a69\u7d93\u676f` : `${winners.length}\u7bc7\u664b\u7ea7${roundLabel(winners.length)}`,
        `${eliminated.length}\u7bc7\u6b62\u6b65${currentLabel}\u3002`,
        winners,
        eliminated,
        winners.length === 1 ? { type: "result" } : { type: "knockout-round" }
      );
    }
    saveTournament();
    renderStage();
  }

  function toggleStageSelection(id, limit) {
    if (stageSelection.has(id)) stageSelection.delete(id);
    else if (stageSelection.size < limit) stageSelection.add(id);
    renderStage();
  }

  function undo() {
    if (!undoStack.length) return;
    tournament = JSON.parse(undoStack.pop());
    stageSelection.clear();
    saveTournament();
    renderStage();
  }

  function stageHeader(kicker, title, meta, progress) {
    const eventTitle = tournament?.title || "詩經三百篇";
    return `
      <div class="stage-top">
        <div>
          <p class="eyebrow">${escapeHtml(fullTitle(eventTitle))}</p>
          <h1>${escapeHtml(title)}</h1>
          <div class="stage-meta">${escapeHtml(meta)}</div>
        </div>
        <button class="quiet-button" type="button" data-action="leave-game">暂存并返回</button>
      </div>
      <div class="stage-progress" aria-label="${escapeHtml(kicker)}进度"><div style="width:${progress}%"></div></div>`;
  }

  function candidateCard(poet, selected, index, compactClass = "") {
    return `
      <button class="candidate-card ${compactClass} ${selected ? "selected" : ""}" type="button"
        data-action="stage-toggle" data-id="${escapeHtml(poet.id)}" aria-pressed="${selected}">
        <span class="number">POEM ${String(index + 1).padStart(2, "0")}</span>
        <strong>${escapeHtml(poet.name)}</strong>
        <small>${escapeHtml(poet.location)}</small>
        ${poemExcerpt(poet)}
      </button>`;
  }

  function renderCut() {
    const state = tournament.cut;
    const required = state.target;
    const selected = stageSelection.size;
    const progress = Math.round((selected / required) * 100);
    app.innerHTML = `<section class="stage-shell">
      ${stageHeader("名单裁定", `保留${required}篇`, `从 ${state.entrants.length} 篇中保留 ${required} 篇；未入选篇目本届不再参赛。`, progress)}
      <div class="stage-card">
        <p class="stage-kicker">ROSTER CUT</p>
        <h2>选择晋级名单</h2>
        <p class="stage-instruction">点选你要保留的篇目。已选 ${selected}/${required} 篇。</p>
        <div class="candidate-grid">${state.entrants.map((poet, index) => candidateCard(poet, stageSelection.has(poet.id), index)).join("")}</div>
        <div class="group-footer">
          <p>${selected === required ? "名单已满，可以继续。" : `还需选择 ${required - selected} 人。`}</p>
          <div class="inline-actions">
            <button class="rank-button" type="button" data-action="system-cut">系统选择${required}篇</button>
            <button class="primary-button" type="button" data-action="confirm-cut" ${selected === required ? "" : "disabled"}>确认名单</button>
          </div>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function renderGroups() {
    const isPrelim = tournament.phase === "prelim";
    const state = currentGroupState();
    const group = state.groups[state.current];
    const completed = state.groups.filter((item) => item.survivors).length;
    const progress = Math.round((completed / state.groups.length) * 100);
    const stageName = isPrelim ? "预选赛" : "小组赛";
    const rule = isPrelim ? "三进二" : "四进二";
    app.innerHTML = `<section class="stage-shell">
      ${stageHeader(stageName, `${rule} · 第${state.current + 1}组`, `共 ${state.groups.length} 组；每组保留2篇。`, progress)}
      <div class="stage-card">
        <p class="stage-kicker">${isPrelim ? "QUALIFYING ROUND" : "GROUP STAGE"}</p>
        <h2>本组选出2篇</h2>
        <p class="stage-instruction">先点选两篇，再确认晋级。已选 ${stageSelection.size}/2 篇。</p>
        <div class="candidate-grid ${group.entrants.length === 3 ? "triad" : ""}">
          ${group.entrants.map((poet, index) => candidateCard(poet, stageSelection.has(poet.id), index)).join("")}
        </div>
        <div class="group-footer">
          <p>完成 ${completed}/${state.groups.length} 组</p>
          <button class="primary-button" type="button" data-action="confirm-group" ${stageSelection.size === 2 ? "" : "disabled"}>确认两篇晋级</button>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function revivalCard(poet, selected) {
    return `
      <button class="revival-card ${selected ? "selected" : ""}" type="button"
        data-action="stage-toggle" data-id="${escapeHtml(poet.id)}" aria-pressed="${selected}">
        <strong>${escapeHtml(poet.name)}</strong>
        <span>${escapeHtml(poet.location)}</span>
        ${poemExcerpt(poet)}
      </button>`;
  }

  function renderRevival() {
    const isPrelim = tournament.phase === "prelim-revival";
    const state = isPrelim ? tournament.prelimRevival : tournament.groupRevival;
    const selected = stageSelection.size;
    const progress = Math.round((selected / state.required) * 100);
    app.innerHTML = `<section class="stage-shell">
      ${stageHeader("复活赛", `复活${state.required}篇`, `从本阶段落选篇目中选回 ${state.required} 篇，凑齐 ${state.survivors.length + state.required} 篇。`, progress)}
      <div class="stage-card">
        <p class="stage-kicker">WILD CARD</p>
        <h2>决定复活名单</h2>
        <p class="stage-instruction">已选 ${selected}/${state.required} 篇；入选篇目将进入淘汰赛。</p>
        <div class="revival-grid">
          ${state.candidates.map((poet) => revivalCard(poet, stageSelection.has(poet.id))).join("")}
        </div>
        <div class="group-footer">
          <p>${selected === state.required ? "复活名单已满。" : `还需选择 ${state.required - selected} 篇。`}</p>
          <button class="primary-button" type="button" data-action="confirm-revival" ${selected === state.required ? "" : "disabled"}>确认复活</button>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function renderByeSelection() {
    const state = tournament.byeSelection;
    const selected = stageSelection.size;
    const playingCount = state.entrants.length - state.required;
    const progress = Math.round((selected / state.required) * 100);
    app.innerHTML = `<section class="stage-shell">
      ${stageHeader("轮空选择", `选择${state.required}人轮空`, `${state.entrants.length}人中选择${state.required}人直接进入16强；其余${playingCount}人进行${playingCount / 2}场比赛。`, progress)}
      <div class="stage-card">
        <p class="stage-kicker">FIRST ROUND BYES</p>
        <h2>决定轮空名单</h2>
        <p class="stage-instruction">已选 ${selected}/${state.required} 人。轮空者直接进入16强，其余选手两两对决。</p>
        <div class="candidate-grid">
          ${state.entrants.map((poet, index) => candidateCard(poet, stageSelection.has(poet.id), index)).join("")}
        </div>
        <div class="group-footer">
          <p>${selected === state.required ? "轮空名单已满，可以开始比赛。" : `还需选择 ${state.required - selected} 人。`}</p>
          <button class="primary-button" type="button" data-action="confirm-byes" ${selected === state.required ? "" : "disabled"}>确认轮空名单</button>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function transitionPerson(poet, status) {
    return `<div class="transition-person ${status}">
      <strong>${escapeHtml(poet.name)}</strong>
      <span>${escapeHtml(poet.location)}</span>
    </div>`;
  }

  function renderTransition() {
    const state = tournament.transition;
    const isFinal = state.next.type === "result";
    app.innerHTML = `<section class="stage-shell transition-shell">
      ${stageHeader(state.kicker, state.title, state.meta, 100)}
      <div class="transition-card">
        <div class="transition-emblem" aria-hidden="true">晋</div>
        <p class="stage-kicker">STAGE COMPLETE</p>
        <h2>本阶段成绩已定</h2>
        <p class="stage-instruction">亮色为晋级篇目，灰色为本阶段淘汰篇目。</p>
        <div class="transition-columns">
          <section class="transition-panel advanced">
            <div class="transition-panel-head"><h3>晋级</h3><b>${state.advanced.length}</b></div>
            <div class="transition-list">${state.advanced.map((poet) => transitionPerson(poet, "advanced")).join("")}</div>
          </section>
          <section class="transition-panel eliminated">
            <div class="transition-panel-head"><h3>淘汰</h3><b>${state.eliminated.length}</b></div>
            <div class="transition-list">${state.eliminated.length ? state.eliminated.map((poet) => transitionPerson(poet, "eliminated")).join("") : '<p class="transition-empty">本阶段无人淘汰</p>'}</div>
          </section>
        </div>
        <div class="transition-footer">
          <span>${escapeHtml(state.meta)}</span>
          <button class="primary-button" type="button" data-action="continue-stage">${isFinal ? "查看最终结果" : "进入下一阶段"}</button>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function roundLabel(count) {
    if (count === 2) return "决赛";
    if (count === 4) return "半决赛";
    if (count === 8) return "八强赛";
    if (count === 16) return "十六强赛";
    if (count > 16 && count < 32) return "十六强资格赛";
    if (count === 32) return "三十二强赛";
    return `${count}强赛`;
  }

  function fighterMarkup(poet, index) {
    return `
      <button class="fighter" type="button" data-action="choose" data-id="${escapeHtml(poet.id)}">
        <span class="fighter-index">篇目 ${index}</span>
        <strong class="fighter-name">${escapeHtml(poet.name)}</strong>
        <span class="fighter-tags">
          <span class="mini-tag">${escapeHtml(poet.location)}</span>
        </span>
        ${poemExcerpt(poet, "fighter-excerpt")}
      </button>`;
  }

  function renderKnockout() {
    const state = tournament.knockout;
    const round = knockoutRound();
    const match = knockoutMatch();
    const playable = round.matches.filter((item) => !item.automatic);
    const completed = playable.filter((item) => item.winner).length;
    const matchNumber = playable.indexOf(match) + 1;
    const progress = Math.round((completed / playable.length) * 100);
    app.innerHTML = `<section class="stage-shell">
      ${stageHeader("淘汰赛", roundLabel(round.entrants.length), `第 ${state.currentRound + 1} 轮 · 本轮第 ${matchNumber}/${playable.length} 场`, progress)}
      ${round.byes.length ? `<div class="bye-note">本轮轮空：${round.byes.map((poet) => escapeHtml(poet.name)).join("、")}，自动进入下一轮。</div>` : ""}
      <div class="versus">
        ${fighterMarkup(match.a, "甲")}
        <div class="vs-mark">VS</div>
        ${fighterMarkup(match.b, "乙")}
      </div>
      ${stageActions()}
    </section>`;
  }

  function stageActions() {
    return `<div class="stage-actions">
      <button class="quiet-button" type="button" data-action="undo" ${undoStack.length ? "" : "disabled"}>撤销上一步</button>
      <button class="danger-button" type="button" data-action="restart">放弃本次比赛</button>
    </div>`;
  }

  function groupSummary(title, state) {
    if (!state) return "";
    return `<div class="result-section"><h3>${escapeHtml(title)}</h3><div class="summary-groups">
      ${state.groups.map((group, index) => {
        const survivorIds = new Set((group.survivors || []).map((poet) => poet.id));
        return `<div class="summary-group"><strong>第 ${index + 1} 组${group.automatic ? " · 自动晋级" : ""}</strong>
          ${group.entrants.map((poet) => `<span class="${survivorIds.has(poet.id) ? "advanced" : ""}">${escapeHtml(poet.name)}${survivorIds.has(poet.id) ? " ↑" : ""}</span>`).join("")}
        </div>`;
      }).join("")}
    </div></div>`;
  }

  function revivalSummary(title, state) {
    if (!state || !state.selected) return "";
    return `<div class="result-section"><h3>${escapeHtml(title)}</h3><p>${state.selected.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>`;
  }

  function byeSummary(state) {
    if (!state || !state.selected) return "";
    return `<div class="result-section"><h3>首轮轮空</h3><p>${state.selected.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>`;
  }

  function advancedIds(round) {
    return new Set(round.matches.map((match) => match.winner && match.winner.id).filter(Boolean));
  }

  function sideEntries(round, side) {
    if (round.matches.length === 1) {
      const match = round.matches[0];
      const poet = side === "left" ? match.a : match.b;
      return poet ? [{ poet, match, matchIndex: 0 }] : [];
    }
    const midpoint = Math.ceil(round.matches.length / 2);
    const offset = side === "left" ? 0 : midpoint;
    const matches = side === "left" ? round.matches.slice(0, midpoint) : round.matches.slice(midpoint);
    return matches.flatMap((match, index) => [match.a, match.b]
      .filter(Boolean)
      .map((poet) => ({ poet, match, matchIndex: offset + index })));
  }

  function orderKnockoutRounds(rounds) {
    if (!rounds.length) return [];
    const orderedMatches = Array(rounds.length);
    orderedMatches[rounds.length - 1] = [...rounds.at(-1).matches];

    // Rebuild the tree backwards from the final. This also repairs the
    // presentation of tournaments completed under older versions that
    // accidentally redrew the bracket after every round.
    for (let roundIndex = rounds.length - 2; roundIndex >= 0; roundIndex -= 1) {
      const desiredWinnerIds = orderedMatches[roundIndex + 1]
        .flatMap((match) => [match.a, match.b])
        .filter(Boolean)
        .map((poet) => poet.id);
      const matchesByWinner = new Map(
        rounds[roundIndex].matches
          .filter((match) => match.winner)
          .map((match) => [match.winner.id, match])
      );
      const ordered = desiredWinnerIds.map((id) => matchesByWinner.get(id)).filter(Boolean);
      const included = new Set(ordered);
      orderedMatches[roundIndex] = [
        ...ordered,
        ...rounds[roundIndex].matches.filter((match) => !included.has(match))
      ];
    }

    return rounds.map((round, index) => {
      const matches = orderedMatches[index];
      return {
        ...round,
        matches,
        entrants: matches.flatMap((match) => [match.a, match.b]).filter(Boolean)
      };
    });
  }

  function bracketNode(poet, advanced) {
    return `<div class="bracket-node ${advanced ? "advanced" : ""}">
      <span>${escapeHtml(poet.name)}</span>${advanced ? '<b>晋</b>' : ""}
    </div>`;
  }

  function bracketStage(round, roundIndex, side) {
    const entries = sideEntries(round, side);
    const advanced = advancedIds(round);
    return `<div class="bracket-stage ${side}" data-round="${roundIndex}">
      <div class="bracket-stage-label">${roundLabel(round.entrants.length)}</div>
      <div class="bracket-stage-nodes">
        ${entries.map(({ poet }) => bracketNode(poet, advanced.has(poet.id))).join("")}
      </div>
    </div>`;
  }

  function symmetricBracket(rounds) {
    const orderedRounds = orderKnockoutRounds(rounds);
    const left = orderedRounds.map((round, index) => bracketStage(round, index, "left")).join("");
    const right = orderedRounds.map((round, index) => bracketStage(round, index, "right")).reverse().join("");
    return `<div class="symmetric-bracket" style="--round-count:${orderedRounds.length}">
      <div class="bracket-wing left-wing">${left}</div>
      <div class="bracket-center">
        <span class="cup-mark">詩經杯</span>
        <small>CHAMPION</small>
        <strong>${escapeHtml(tournament.champion.name)}</strong>
        <i>${escapeHtml(tournament.title)}</i>
      </div>
      <div class="bracket-wing right-wing">${right}</div>
    </div>`;
  }

  function renderResult() {
    const rounds = tournament.knockout.rounds;
    app.innerHTML = `
      <section class="result-head">
        <p class="eyebrow">TOURNAMENT COMPLETE</p>
        <h1>${escapeHtml(fullTitle(tournament.title))}</h1>
        <p class="lead" style="margin-left:auto;margin-right:auto">从 ${tournament.initialCount} 篇代表作中产生了你的冠军。对阵图由左右两侧逐轮向中央汇合。</p>
        <div class="result-actions">
          <button class="primary-button" type="button" data-action="download">下载晋级图 PNG</button>
          <button class="quiet-button" type="button" data-action="new-game">再来一次</button>
        </div>
      </section>
      <section class="result-card">
        <div class="result-section bracket-result-section">
          <div class="bracket-title-row">
            <h3>淘汰赛完整对阵</h3>
            <span>左右滑动查看完整签表</span>
          </div>
          <div class="bracket-wrap">${symmetricBracket(rounds)}</div>
        </div>
        ${statisticsMarkup()}
        ${tournament.cut && tournament.cut.kept ? `<div class="result-section"><h3>名单裁定</h3><p>保留：${tournament.cut.kept.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>` : ""}
        ${byeSummary(tournament.byeSelection)}
        ${groupSummary("预选赛", tournament.prelim)}
        ${revivalSummary("预选复活", tournament.prelimRevival)}
        ${groupSummary("小组赛", tournament.groupStage)}
        ${revivalSummary("小组复活", tournament.groupRevival)}
      </section>`;
    updateResumeButton();
    submitStatistics();
  }

  function renderStage() {
    if (!tournament) return renderHome();
    if (tournament.phase === "cut") return renderCut();
    if (tournament.phase === "prelim" || tournament.phase === "groups") return renderGroups();
    if (tournament.phase === "prelim-revival" || tournament.phase === "group-revival") return renderRevival();
    if (tournament.phase === "bye-selection") return renderByeSelection();
    if (tournament.phase === "transition") return renderTransition();
    if (tournament.phase === "knockout") return renderKnockout();
    if (tournament.phase === "result") return renderResult();
  }

  function downloadResult() {
    const rounds = orderKnockoutRounds(tournament.knockout.rounds);
    const width = 1900;
    const outerCount = Math.max(sideEntries(rounds[0], "left").length, sideEntries(rounds[0], "right").length);
    const height = Math.max(1120, outerCount * 58 + 250);
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#eee9de";
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#122d27";
    ctx.fillRect(0, 0, width, 136);
    ctx.textAlign = "center";
    ctx.fillStyle = "#d5b575";
    ctx.font = '700 18px "Microsoft YaHei", sans-serif';
    ctx.fillText("THE BOOK OF SONGS CUP", width / 2, 42);
    ctx.fillStyle = "#ffffff";
    ctx.font = '800 38px "Microsoft YaHei", sans-serif';
    ctx.fillText(fullTitle(tournament.title), width / 2, 92);

    const nodeWidth = 132;
    const nodeHeight = 34;
    const stageGap = 150;
    const top = 190;
    const areaHeight = height - 270;
    const centerX = width / 2;

    const drawWing = (side) => {
      rounds.forEach((round, roundIndex) => {
        const entries = sideEntries(round, side);
        const advanced = advancedIds(round);
        const x = side === "left"
          ? 40 + roundIndex * stageGap
          : width - 40 - nodeWidth - roundIndex * stageGap;

        ctx.textAlign = "center";
        ctx.fillStyle = "#756e61";
        ctx.font = '600 11px "Microsoft YaHei", sans-serif';
        ctx.fillText(roundLabel(round.entrants.length), x + nodeWidth / 2, top - 22);

        entries.forEach((entry, index) => {
          const poet = entry.poet;
          const y = top + ((index + .5) * areaHeight / entries.length) - nodeHeight / 2;
          const passed = advanced.has(poet.id);
          ctx.fillStyle = passed ? "#fffdf8" : "#e3ded3";
          ctx.strokeStyle = passed ? "#9f352d" : "#c9c2b5";
          ctx.lineWidth = passed ? 2 : 1;
          ctx.beginPath();
          ctx.roundRect(x, y, nodeWidth, nodeHeight, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = passed ? "#18201d" : "#8b857a";
          ctx.textAlign = "center";
          ctx.font = `${passed ? "700" : "400"} 13px "Microsoft YaHei", sans-serif`;
          ctx.fillText(poet.name, x + nodeWidth / 2, y + 22);

          const nextEntries = roundIndex + 1 < rounds.length ? sideEntries(rounds[roundIndex + 1], side) : [];
          const successor = entry.match.winner;
          const nextIndex = successor ? nextEntries.findIndex((item) => item.poet.id === successor.id) : -1;
          const nextY = roundIndex + 1 < rounds.length && nextIndex >= 0
            ? top + ((nextIndex + .5) * areaHeight / nextEntries.length)
            : top + areaHeight / 2;
          const startX = side === "left" ? x + nodeWidth : x;
          const endX = roundIndex + 1 < rounds.length
            ? (side === "left" ? x + stageGap : x - stageGap + nodeWidth)
            : centerX + (side === "left" ? -105 : 105);
          const midX = (startX + endX) / 2;
          ctx.strokeStyle = passed ? "#a23a31" : "#c8c1b5";
          ctx.lineWidth = passed ? 1.6 : 1;
          ctx.beginPath();
          ctx.moveTo(startX, y + nodeHeight / 2);
          ctx.lineTo(midX, y + nodeHeight / 2);
          ctx.lineTo(midX, nextY);
          ctx.lineTo(endX, nextY);
          ctx.stroke();
        });
      });
    };

    drawWing("left");
    drawWing("right");

    const championY = top + areaHeight / 2 - 92;
    ctx.fillStyle = "#9f352d";
    ctx.beginPath();
    ctx.roundRect(centerX - 108, championY, 216, 184, 12);
    ctx.fill();
    ctx.fillStyle = "#e9d49f";
    ctx.font = '700 13px "Microsoft YaHei", sans-serif';
    ctx.fillText("詩經杯 · CHAMPION", centerX, championY + 38);
    ctx.fillStyle = "#ffffff";
    ctx.font = '800 36px "Microsoft YaHei", sans-serif';
    ctx.fillText(tournament.champion.name, centerX, championY + 101);
    ctx.fillStyle = "#f1dcd7";
    ctx.font = '500 12px "Microsoft YaHei", sans-serif';
    ctx.fillText(tournament.title, centerX, championY + 137);

    const filename = `${fullTitle(tournament.title)}-${tournament.champion.name}.png`;
    const trigger = (url) => {
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      link.click();
    };
    canvas.toBlob((blob) => {
      if (!blob) return trigger(canvas.toDataURL("image/png"));
      const url = URL.createObjectURL(blob);
      trigger(url);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;

    if (action === "home") {
      event.preventDefault();
      renderHome();
    } else if (action === "start-preselection") {
      preselection = { current: 0, selections: {} };
      savePreselection();
      renderPreselection();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "resume-preselection") {
      preselection = loadPreselection() || { current: 0, selections: {} };
      const complete = data.selectionUnits.every((unit) => (preselection.selections[unit.id] || []).length === unit.quota);
      complete ? renderPreselectionSummary() : renderPreselection();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "preselect-toggle") {
      const unit = data.selectionUnits[preselection.current];
      const selected = selectedIdsForUnit(unit);
      const id = target.dataset.id;
      if (selected.has(id)) selected.delete(id);
      else if (selected.size < unit.quota) selected.add(id);
      preselection.selections[unit.id] = [...selected];
      savePreselection();
      renderPreselection();
    } else if (action === "preselect-prev") {
      if (preselection.current > 0) preselection.current -= 1;
      savePreselection();
      renderPreselection();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "confirm-preselection") {
      const unit = data.selectionUnits[preselection.current];
      if (selectedIdsForUnit(unit).size !== unit.quota) return;
      if (preselection.current === data.selectionUnits.length - 1) renderPreselectionSummary();
      else {
        preselection.current += 1;
        savePreselection();
        renderPreselection();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "edit-preselection") {
      preselection.current = Number(target.dataset.index);
      savePreselection();
      renderPreselection();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "preselect-home" || action === "leave-game" && !tournament) {
      savePreselection();
      renderHome();
    } else if (action === "restart-preselection") {
      if (window.confirm("是否确认重新开始篇目预选？当前预选记录将被清除。")) {
        preselection = { current: 0, selections: {} };
        savePreselection();
        renderPreselection();
      }
    } else if (action === "start-main-tournament") {
      const entrants = allPreselectedPoems();
      if (entrants.length !== 48) return;
      startTournament(entrants);
    } else if (action === "mode") {
      mode = target.dataset.mode;
      renderHome();
      document.getElementById("selection")?.scrollIntoView({ behavior: "smooth" });
    } else if (action === "period-tag") {
      const value = target.dataset.value;
      selectedPeriods.has(value) ? selectedPeriods.delete(value) : selectedPeriods.add(value);
      resetSelectionToTags();
      renderHome();
    } else if (action === "genre-tag") {
      const value = target.dataset.value;
      selectedGenres.has(value) ? selectedGenres.delete(value) : selectedGenres.add(value);
      resetSelectionToTags();
      renderHome();
    } else if (action === "toggle-poet") {
      const id = target.dataset.id;
      selectedCustom.has(id) ? selectedCustom.delete(id) : selectedCustom.add(id);
      renderHome();
    } else if (action === "select-all") {
      selectedCustom = new Set(filteredPoets().map((poet) => poet.id));
      renderHome();
    } else if (action === "clear-selection") {
      selectedCustom.clear();
      renderHome();
    } else if (action === "random-48") {
      const filtered = filteredPoets();
      selectedCustom = new Set(shuffle(filtered).slice(0, Math.min(48, filtered.length)).map((poet) => poet.id));
      renderHome();
    } else if (action === "system-select") {
      const count = Number(target.dataset.count);
      const currentPool = filteredPoets();
      if (currentPool.length > count) {
        selectedCustom = new Set(topRanked(currentPool, count).map((poet) => poet.id));
        renderHome();
      }
    } else if (action === "start") {
      startTournament();
    } else if (action === "stage-toggle") {
      const limit = tournament.phase === "cut"
        ? tournament.cut.target
        : (tournament.phase === "bye-selection"
          ? tournament.byeSelection.required
        : (tournament.phase.includes("revival")
          ? (tournament.phase === "prelim-revival" ? tournament.prelimRevival.required : tournament.groupRevival.required)
          : 2));
      toggleStageSelection(target.dataset.id, limit);
    } else if (action === "confirm-cut") {
      confirmCut();
    } else if (action === "system-cut") {
      stageSelection = new Set(topRanked(tournament.cut.entrants, tournament.cut.target).map((poet) => poet.id));
      renderStage();
    } else if (action === "confirm-group") {
      confirmGroup();
    } else if (action === "confirm-revival") {
      confirmRevival();
    } else if (action === "confirm-byes") {
      confirmByes();
    } else if (action === "choose") {
      chooseWinner(target.dataset.id);
    } else if (action === "continue-stage") {
      continueTransition();
    } else if (action === "undo") {
      undo();
    } else if (action === "leave-game") {
      renderHome();
    } else if (action === "restart") {
      showRestartConfirmation(target);
    } else if (action === "cancel-restart") {
      hideRestartConfirmation();
    } else if (action === "confirm-restart") {
      abandonTournament();
    } else if (action === "new-game") {
      abandonTournament();
    } else if (action === "resume") {
      tournament = loadTournament();
      stageSelection.clear();
      undoStack = [];
      tournament ? renderStage() : renderHome();
    } else if (action === "download") {
      downloadResult();
    } else if (action === "retry-statistics") {
      submitStatistics();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") hideRestartConfirmation();
  });

  document.querySelector("[data-confirm-restart]")?.addEventListener("click", (event) => {
    if (event.target === event.currentTarget) hideRestartConfirmation();
  });

  document.addEventListener("input", (event) => {
    if (!event.target.matches("[data-search]")) return;
    searchText = event.target.value;
    const visible = filteredPoets().filter((poet) => poet.name.includes(searchText.trim()));
    const grid = document.querySelector(".poet-grid");
    if (grid) {
      grid.innerHTML = visible.length
        ? visible.map((poet) => poetChip(poet, selectedCustom.has(poet.id))).join("")
        : '<div class="empty">当前标签或搜索条件下没有作者。</div>';
    }
  });

  function validateKnockout() {
    const errors = [];
    const rounds = tournament?.knockout?.rounds || [];
    rounds.forEach((round, index) => {
      round.matches.forEach((match, matchIndex) => {
        if (!match.winner) errors.push(`round ${index} match ${matchIndex}: missing winner`);
        else if (match.winner.id !== match.a?.id && match.winner.id !== match.b?.id) errors.push(`round ${index} match ${matchIndex}: winner not in match`);
      });
      if (index + 1 < rounds.length) {
        const expected = round.matches.map((match) => match.winner?.id).filter(Boolean);
        const actual = rounds[index + 1].entrants.map((poet) => poet.id);
        if (expected.join("|") !== actual.join("|")) errors.push(`round ${index}: successor order mismatch`);
      }
    });
    if (tournament?.champion && rounds.length) {
      const finalWinner = rounds.at(-1).matches[0]?.winner;
      if (!finalWinner || finalWinner.id !== tournament.champion.id) errors.push("champion mismatch");
    }
    return { valid: errors.length === 0, errors, rounds: rounds.length };
  }

  window.__SHIJING_CUP_TEST__ = { formatForCount, buildGroups, byeCountFor, buildKnockoutRound, orderKnockoutRounds, placementsFromTournament, validateKnockout, getTournament: () => tournament };
  updateResumeButton();
  renderHome();
})();

</script>
</body>
</html>
